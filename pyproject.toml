[project]
name = "product-image-finder"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.3.5",
  "openpyxl==3.1.5",
  "Pillow==12.3.0",
  "requests==2.34.2",
  "opencv-python-headless==4.10.0.84",
  "rapidfuzz==3.14.6",
  "python-dotenv==1.2.4",
  "tqdm==4.70.1",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "itsdangerous==2.2.0",
  "psycopg[binary]==3.3.6",
]

[tool.vercel]
entrypoint = "backend.app:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm run build --prefix frontend"
